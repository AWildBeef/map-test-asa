<!doctype html>
<html>
<head>
  <meta charset="utf-8"> 

  <!-- 🏷️ What shows in the browser tab -->
  <title>ASA Spawn Maps</title>
  <link rel="icon" href="favicon.ico">

  <!-- 📱 Makes the page scale correctly on phones (without this, mobile looks weird/zoomed) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 🗺️ Leaflet CSS: makes the map + controls look correct -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- 🧠 Leaflet JS: the actual map engine -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/eruda"></script>
  <script>
    eruda.init();
  </script>
  <!-- 🎨 Your CSS file (all the styling we keep tweaking) -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="topbar">
    <div class="title">ASA Spawn Maps</div>
  
    <div class="controls">
      <select id="sourceSelect"></select>
      <div id="sourceSelectFancy"></div>
  
      <select id="mapSelect"></select>
      <div id="mapSelectFancy"></div>
  
      <select id="dinoSelect"></select>
      <div id="dinoSelectFancy"></div>
    </div>
  
    <div class="title-actions">
      <button id="modeToggle" class="mode-toggle" type="button" title="Toggle view">Dinos</button>
  
      <button id="controlsToggle" class="icon-btn" title="Filters" aria-label="Filters">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="mapWrap">
    <div id="map"></div>
    <div id="rarityLegend" class="rarity-legend" style="display:none">
      <span class="rl-end rl-left">very common</span>
    
      <div class="rl-bar" aria-label="Rarity scale">
        <span class="rl-sq" data-r="very common" data-label="very common"></span>
        <span class="rl-sq" data-r="common" data-label="common"></span>
        <span class="rl-sq" data-r="uncommon" data-label="uncommon"></span>
        <span class="rl-sq" data-r="very uncommon" data-label="very uncommon"></span>
        <span class="rl-sq" data-r="rare" data-label="rare"></span>
        <span class="rl-sq" data-r="very rare" data-label="very rare"></span>
      </div>
      <span class="rl-end rl-right">very rare</span>
    </div>
  </div>
  <div id="buildInfo">v1.28</div>

  <!-- 🧠 Your main JS -->
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AWildBeef/atlas-live-css@main/live-css.js?v=3474858"></script>
  <script>
    AtlasLiveCSS.init({
      queryParam: "livecss",
      enabledOnParam: true,
      fabText:"🖍️",
      storageKey: "asa_spawnmaps_live_css_v1",
      storagePosKey: "asa_spawnmaps_live_css_pos_v1",
      storageSizeKey: "asa_spawnmaps_live_css_size_v1",
      storageOpenKey: "asa_spawnmaps_live_css_open_v1",
      panelWidth: 220,
      panelHeight: 100,
      offsetRight: 160,
      offsetBottom: 14
    });
  </script>
</body>
</html>
