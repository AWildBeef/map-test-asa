<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <!-- 🏷️ What shows in the browser tab -->
  <title>ASA Spawn Maps</title>

  <!-- 📱 Makes the page scale correctly on phones (without this, mobile looks weird/zoomed) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 🗺️ Leaflet CSS: makes the map + controls look correct -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- 🧠 Leaflet JS: the actual map engine -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 🎨 Your CSS file (all the styling we keep tweaking) -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================================================
       📌 TOPBAR (the stuff ABOVE the map)
       This whole block is styled by:
         #topbar
         .title-row
         .controls
         #topbar select
       ========================================================= -->
  <div id="topbar">

    <!-- =======================================================
         🧾 TITLE ROW (Title on left, Filters button on right)
         Styled by:
           .title-row
           #topbar .title
           .controls-toggle
         ======================================================= -->
    <div class="title-row">

      <!-- 🏷️ Big title text
           Styled by:
             #topbar .title
           If you want the title smaller/bigger: change font-size there -->
      <div class="title">ASA Spawn Maps (test)</div>

      <!-- 📱 Filters button (ONLY visible on mobile)
           What it does:
             - On click, app.js toggles: #topbar.show-controls
             - That class makes the dropdowns appear/disappear on mobile
           Styled by:
             .controls-toggle
             @media (max-width: 640px) { .controls-toggle { display: inline-flex; } }
      -->
      <button id="modeToggle" class="mode-toggle" type="button" title="Toggle view">
        Dinos
      </button>
      <button id="controlsToggle" class="icon-btn" title="Filters" aria-label="Filters">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      
    </div>

    <!-- =======================================================
         🎛️ CONTROLS ROW (the dropdowns)
         This whole row is styled by:
           #topbar .controls
           #topbar .controls > select
           #topbar select
         Mobile behavior:
           - hidden by default on small screens
           - shown when #topbar has class "show-controls"
         ======================================================= -->
    <div class="controls">

      <!-- 🌍 Source dropdown (Official / Mods)
           JS fills this list in setupSourceDropdown()
           Styling comes from #topbar select and #topbar .controls > select -->
      <select id="sourceSelect"></select>

      <!-- 🗺️ Map dropdown (The Island / Center / etc)
           JS fills this list in setupMapDropdown() -->
      <select id="mapSelect"></select>

      <!-- 🦖 Dino dropdown (list changes based on source+map)
           JS fills this list in setupDropdown() -->
      <select id="dinoSelect"></select>

      <!-- 🖼️ Background dropdown wrapper (only for maps that have multiple backgrounds)
           JS shows/hides this by changing style.display
           IMPORTANT: this wrapper is NOT a <select>, it’s a <div>,
           so it won’t be affected by "#topbar .controls > select" flex rules unless we add CSS for it -->
      <div id="bgSelectWrap" style="display:none;">
        <select id="bgSelect"></select>
      </div>
      
    </div><!-- /.controls -->
  </div><!-- /#topbar -->


  <div id="mapWrap">
    <div id="map"></div>
  </div>
  <div id="buildInfo">v1.166</div>

  <!-- 🧠 Your main JS -->
  <script src="app.js"></script>

</body>
</html>
