<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <!-- 🏷️ What shows in the browser tab -->
  <title>ASA Spawn Maps</title>

  <!-- 📱 Makes the page scale correctly on phones (without this, mobile looks weird/zoomed) -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- 🗺️ Leaflet CSS: makes the map + controls look correct -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- 🧠 Leaflet JS: the actual map engine -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 🎨 Your CSS file (all the styling we keep tweaking) -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="topbar">
    <div class="title">ASA Spawn Maps (test)</div>
  
    <div class="controls">
      <select id="sourceSelect"></select>
      <div id="sourceSelectFancy"></div>
  
      <select id="mapSelect"></select>
      <div id="mapSelectFancy"></div>
  
      <select id="dinoSelect"></select>
      <div id="dinoSelectFancy"></div>
    </div>
  
    <div class="title-actions">
      <button id="modeToggle" class="mode-toggle" type="button" title="Toggle view">Dinos</button>
  
      <button id="controlsToggle" class="icon-btn" title="Filters" aria-label="Filters">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="mapWrap">
    <div id="map"></div>
    <div id="rarityLegend" class="rarity-legend" aria-label="Rarity legend" title="Tap to collapse">
      <div class="legend-title">
        <span class="legend-caret">▾</span>
        <span class="legend-text">Rarity</span>
      </div>
    
      <div class="rarity-strip" role="img" aria-label="Rarity colors, very common to very rare">
        <span class="sq" data-r="very common" title="Very common"></span>
        <span class="sq" data-r="common" title="Common"></span>
        <span class="sq" data-r="uncommon" title="Uncommon"></span>
        <span class="sq" data-r="very uncommon" title="Very uncommon"></span>
        <span class="sq" data-r="rare" title="Rare"></span>
        <span class="sq" data-r="very rare" title="Very rare"></span>
      </div>
    
      <!-- Optional: tiny end labels (comment out if too much) -->
      <div class="legend-ends" aria-hidden="true">
        <span>VC</span><span>VR</span>
      </div>
    </div>
  </div>
  <div id="buildInfo">v1.27</div>

  <!-- 🧠 Your main JS -->
  <script src="app.js"></script>

</body>
</html>
